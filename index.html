<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>報告電子書</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tinos:ital,wght@0,400;0,700;1,400&family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
/* Layout: a bound clinical report — spine on the binding side, section index tabs opposite, journal-style running header and footer, presenter bar below */
:root{
  --desk:#e8ecf0; --paper:#ffffff; --grid:#eef2f5; --ink:#11304d; --text:#24313d; --muted:#5d6b78; --line:#d6dde4; --green:#0b6e72; --green-soft:#e5f1f1; --on-green:#ffffff; --insitu:#c7862b; --inv:#2c5f8f; --c3:#3f8f86; --c4:#d0a03a; --c5:#b03a36; --c6:#8995a1; --ok:#2c8a57; --ok-soft:#e0f1e7; --bad:#b9382c; --bad-soft:#f8e3e0; --bar:#0e2232; --bar-fg:#e8eef2; --bar-muted:#8ea0ae; --note-bg:#0e1c27; --note-fg:#eef3f6; --ring-a:#c5ccd3; --ring-b:#f4f6f8;
  --f-body:"Times New Roman",Times,Tinos,"DFKai-SB","標楷體","BiauKai","TW-Kai","Kaiti TC","STKaiti","KaiTi","LXGW WenKai TC",serif;
  --f-serif:var(--f-body);
  --f-num:var(--f-body);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){ --desk:#0b131a; --paper:#121c25; --grid:#1a2631; --ink:#e3ecf3; --text:#c9d4dd; --muted:#8d9cab; --line:#26343f; --green:#43aeb0; --green-soft:#16303a; --on-green:#081218; --insitu:#e8a24f; --inv:#7aa6d6; --c3:#5fbcae; --c4:#e8c25c; --c5:#ef7b72; --c6:#97a4b0; --ok:#5cc28a; --ok-soft:#173528; --bad:#ff8273; --bad-soft:#3a1f1c; --bar:#060d13; --bar-fg:#e3ecf3; --bar-muted:#7e8f9c; --note-bg:#050b10; --note-fg:#e9f0f4; --ring-a:#2a3742; --ring-b:#4a5a66; color-scheme:dark}}
:root[data-theme="dark"]{ --desk:#0b131a; --paper:#121c25; --grid:#1a2631; --ink:#e3ecf3; --text:#c9d4dd; --muted:#8d9cab; --line:#26343f; --green:#43aeb0; --green-soft:#16303a; --on-green:#081218; --insitu:#e8a24f; --inv:#7aa6d6; --c3:#5fbcae; --c4:#e8c25c; --c5:#ef7b72; --c6:#97a4b0; --ok:#5cc28a; --ok-soft:#173528; --bad:#ff8273; --bad-soft:#3a1f1c; --bar:#060d13; --bar-fg:#e3ecf3; --bar-muted:#7e8f9c; --note-bg:#050b10; --note-fg:#e9f0f4; --ring-a:#2a3742; --ring-b:#4a5a66; color-scheme:dark}

html,body{height:100%}
body{background:var(--desk);color:var(--text);font-family:var(--f-body);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--insitu);outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:auto 1fr auto}
.top{display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));color:var(--muted);font-size:14px}
.top b{color:var(--ink);font-weight:700}
.top .sp{flex:1}
.desk{min-height:0;display:flex;justify-content:center;padding-block:4px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.book{position:relative;display:flex;width:100%;max-width:1280px;min-height:0}
.rings{position:absolute;left:-10px;top:24px;bottom:24px;display:flex;flex-direction:column;justify-content:space-between;z-index:2;pointer-events:none}
.rings i{display:block;width:30px;height:10px;border-radius:6px;background:linear-gradient(var(--ring-a),var(--ring-b) 45%,var(--ring-a))}
.paper,.leaf,.under{flex:1;min-width:0;position:relative;border-radius:14px;background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;box-shadow:0 2px 0 var(--line),0 18px 40px -24px rgba(0,0,0,.45);overflow:auto;
  padding:clamp(20px,3.4vw,48px) clamp(20px,4.2vw,64px) 44px clamp(28px,5vw,80px);font-size:clamp(15px,1.25vw,19px)}
.tabs{display:flex;flex-direction:column;gap:6px;padding:28px 0 0 8px}
.tab{width:42px;min-height:42px;border:0;border-radius:0 8px 8px 0;background:var(--green);color:var(--on-green);font-weight:700;font-size:16px;opacity:.85}
.tab[aria-current="true"]{background:var(--ink);color:var(--paper);opacity:1;transform:translateX(4px)}
.tab:hover{opacity:1}

/* page */
.kicker{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.8em;letter-spacing:.06em}
.ubadge{display:inline-grid;place-items:center;min-width:1.7em;height:1.7em;padding:0 .3em;border-radius:6px;background:var(--green);color:var(--on-green);font-weight:700;font-size:.85em;letter-spacing:0}
h1{font-size:clamp(26px,2.6vw,40px);font-weight:900;color:var(--ink);margin:.25em 0 .6em;text-wrap:balance;line-height:1.2}
h3{font-size:1em;color:var(--ink);margin:0 0 .4em}
p{line-height:1.7;margin:0 0 .7em;max-width:40em}
.split{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:clamp(18px,3vw,44px);align-items:start}
.split > *{min-width:0}
.aside{color:var(--muted);line-height:1.75;font-size:.95em;padding-top:.3em}
.aside strong{color:var(--ink)}
.aside ul{margin:0;padding-left:1.1em;display:grid;gap:.45em}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.big{font-family:var(--f-num);font-weight:600;color:var(--ink);font-size:2.3em;line-height:1}
.pfoot{position:absolute;left:clamp(28px,5vw,80px);bottom:14px;font-size:12px;color:var(--muted)}

.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.78em;color:var(--muted);margin:0 0 6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg .t{fill:var(--muted);font-size:12px;font-family:var(--f-body)}
svg .v{fill:var(--ink);font-size:12px;font-family:var(--f-num);font-weight:600}
svg .gl{stroke:var(--line);stroke-width:1}
.cap{font-size:.75em;color:var(--muted);margin-top:4px}

.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.85em;background:var(--paper)}
th,td{padding:.5em .7em;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:.9em;white-space:nowrap}
td.n,th.n{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.hl td{background:var(--green-soft)}
tr.tot td{font-weight:700;color:var(--ink)}

.pill{display:inline-block;padding:.12em .6em;border-radius:999px;font-size:.8em;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.mid{background:var(--grid);color:var(--muted)}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:.25em 1em;font-size:.85em;color:var(--text)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

details.acc{border:1px solid var(--line);border-radius:10px;background:var(--paper);margin-bottom:8px}
details.acc summary{list-style:none;display:flex;align-items:center;gap:12px;padding:.65em .9em;cursor:pointer;color:var(--ink);font-weight:500}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"＋";margin-left:auto;color:var(--muted)}
details.acc[open] summary::after{content:"－"}
details.acc .tag{flex:none;background:var(--green);color:var(--on-green);border-radius:6px;font-size:.72em;padding:.2em .55em;font-weight:700}
.accb{padding:0 1em 1em 1em;display:grid;gap:.6em;font-size:.92em}
.accb dl{margin:0;display:grid;grid-template-columns:5.5em 1fr;gap:.35em .8em}
.accb dt{color:var(--muted)}
.accb dd{margin:0;line-height:1.6}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:16px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;gap:8px;align-content:start}
.card .lbl{font-size:.8em;color:var(--muted);letter-spacing:.04em}
.meter{position:relative;height:10px;border-radius:5px;background:var(--grid);margin-top:4px}
.meter b{position:absolute;inset:0 auto 0 0;border-radius:5px;background:var(--green)}
.meter u{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink)}
.meter-l{display:flex;justify-content:space-between;font-size:.72em;color:var(--muted)}

.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px;margin-top:8px}
.flow div{flex:1 1 140px;background:var(--paper);border:1.5px solid var(--green);border-radius:10px;padding:.6em .8em;font-size:.85em;line-height:1.5}
.flow div b{display:block;color:var(--green);font-size:.8em;letter-spacing:.06em}
.flow span{align-self:center;color:var(--green);font-weight:900}

.cover{display:grid;gap:clamp(20px,3vw,36px);padding-top:clamp(8px,3vh,40px)}
.cover h1{font-size:clamp(34px,4.4vw,64px);margin:0}
.cover .sub{font-size:1.15em;color:var(--muted);margin:0}
.stats{display:flex;flex-wrap:wrap;gap:clamp(18px,4vw,56px)}
.stats div{display:grid;gap:6px}
.stats .big{font-size:clamp(36px,4vw,60px)}
.stats small{color:var(--muted);font-size:.85em}
.toclist{display:grid;gap:10px;max-width:760px}
.toclist button{display:flex;align-items:center;gap:14px;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:.7em 1em}
.toclist button span.d{margin-left:auto;color:var(--muted);font-size:.8em}

/* presenter bar */
.bar{display:flex;align-items:center;gap:10px;background:var(--bar);color:var(--bar-fg);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bbtn{border:1.5px solid var(--bar-muted);background:transparent;color:var(--bar-fg);border-radius:8px;padding:.35em .85em;font-size:14px;white-space:nowrap}
.bbtn[aria-pressed="true"]{background:var(--bar-fg);color:var(--bar)}
.dots{flex:1;min-width:0;display:flex;align-items:center;gap:5px;overflow:hidden;padding:0 6px}
.dot{flex:none;width:9px;height:9px;border-radius:50%;border:0;padding:0;opacity:.45}
.dot[aria-current="true"]{opacity:1;transform:scale(1.5);box-shadow:0 0 0 2px var(--bar-fg)}
.count{font-family:var(--f-num);font-size:14px;color:var(--bar-muted);white-space:nowrap}

.note{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(70px + env(safe-area-inset-bottom,0px));width:min(420px,calc(100vw - 40px));background:var(--note-bg);color:var(--note-fg);border-radius:12px;padding:14px 18px;box-shadow:0 12px 30px rgba(0,0,0,.35);z-index:20;font-size:15px;line-height:1.7}
.note .h{color:var(--green);font-weight:700;font-size:13px;margin-bottom:4px;font-family:var(--f-num)}
.note ul{margin:0;padding-left:1.1em}

.toc{position:fixed;inset:0;background:rgba(5,12,15,.55);z-index:30;display:grid;place-items:center;padding:20px}
.tocp{background:var(--paper);color:var(--text);border-radius:14px;max-width:640px;width:100%;max-height:80vh;overflow:auto;padding:22px 24px}
.tocp h2{margin:0;color:var(--ink);font-size:20px}
.toch{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.tocp .hint{font-size:13px;color:var(--muted);margin:0 0 10px}
.erows{display:grid;gap:8px;margin-bottom:14px}
.er{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:.5em .7em}
.er.start{border-color:var(--green);background:var(--green-soft)}
.er label{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);white-space:nowrap}
.er input[type=text]{font:inherit;font-size:14px;padding:.35em .55em;border:1.5px solid var(--line);border-radius:6px;background:var(--paper);color:var(--text);min-width:0;width:100%}
.er .un{grid-column:2}
.er .un[hidden]{display:none}
.tocp ol{margin:0;padding:0;list-style:none;display:grid;gap:2px}
.tocp li button{width:100%;text-align:left;border:0;background:transparent;padding:.45em .6em;border-radius:8px;display:flex;gap:10px;align-items:center}
.tocp li button:hover,.tocp li button[aria-current="true"]{background:var(--green-soft)}
.tocp .pn{font-family:var(--f-num);color:var(--muted);font-size:13px;width:2em}

/* toolbar, flipping, right-bound mode, upload */
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tbtn{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:.3em .85em;font-size:14px;white-space:nowrap}
.tbtn.primary{background:var(--green);border-color:var(--green);color:var(--on-green);font-weight:700}
.tbtn:disabled{opacity:.45;cursor:default}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:transparent;padding:.3em .8em;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:700}
.sheet{flex:1;min-width:0;position:relative;display:flex;perspective:4200px}
.top,.bar{position:relative;z-index:8}
input{box-sizing:border-box}
.flowtext td p,.flowtext th p{margin:0}
.pdfpage img{cursor:zoom-in}
.pdfpage.zoom img{max-height:none;width:100%;cursor:zoom-out}
.leaf,.under{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:5}
.under{z-index:4}
.leaf{backface-visibility:hidden;will-change:transform}
.shade{position:absolute;inset:0;opacity:0;pointer-events:none}
.shade.r{background:linear-gradient(to right,rgba(0,0,0,.45),rgba(0,0,0,0) 75%)}
.shade.l{background:linear-gradient(to left,rgba(0,0,0,.45),rgba(0,0,0,0) 75%)}
.bbtn:disabled{opacity:.35;cursor:default}
.app.rtl .book{flex-direction:row-reverse}
.app.rtl .rings{left:auto;right:-10px}
.app.rtl .tabs{padding:28px 8px 0 0}
.app.rtl .tab{border-radius:8px 0 0 8px}
.app.rtl .tab[aria-current="true"]{transform:translateX(-4px)}
.app.rtl .paper,.app.rtl .leaf,.app.rtl .under{padding:clamp(20px,3.4vw,48px) clamp(28px,5vw,80px) 44px clamp(20px,4.2vw,64px)}
.app.rtl .pfoot{left:auto;right:clamp(28px,5vw,80px)}
.app.rtl .dots{direction:rtl}
.tabs{overflow-y:auto;scrollbar-width:none}
.note .h span{float:right;color:var(--bar-muted);font-weight:400;font-family:var(--f-body)}
.note ul{outline:none;min-height:1.6em}
.note ul:empty::before{content:"點這裡輸入這一頁的講師筆記";opacity:.55}
.dlg{background:var(--paper);color:var(--text);border-radius:14px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:22px 24px;display:grid;gap:14px}
.dlg h2{margin:0;color:var(--ink);font-size:20px}
.dlg .hint{font-size:13px;color:var(--muted);line-height:1.6;margin:0}
.drop{border:2px dashed var(--green);border-radius:12px;padding:20px;text-align:center;display:grid;gap:6px;background:var(--green-soft);cursor:pointer;color:var(--ink)}
.drop small{color:var(--muted)}
.drop #dropName{font-weight:700;word-break:break-all}
.fld{display:grid;gap:6px;font-size:14px;color:var(--muted)}
.fld input{font:inherit;font-size:15px;padding:.5em .7em;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);color:var(--text)}
fieldset{border:0;margin:0;padding:0;display:grid;gap:8px}
legend.lg{font-size:14px;color:var(--muted);padding:0;margin-bottom:6px}
label.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;padding:.6em .8em;font-size:14px;line-height:1.55;cursor:pointer}
label.opt:has(input:checked){border-color:var(--green);background:var(--green-soft)}
label.opt b{color:var(--ink)}
.status{font-size:14px;color:var(--green);min-height:1.4em;margin:0}
.status.err{color:var(--bad)}
.drow{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.dropall{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(10,40,36,.55);color:#fff;font-size:28px;font-weight:900;pointer-events:none;outline:6px dashed rgba(255,255,255,.8);outline-offset:-24px}
.toast{pointer-events:none;position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:.55em 1.1em;border-radius:8px;z-index:50;font-size:14px;box-shadow:0 8px 20px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}
.flowtext{max-width:46em}
.flowtext p{max-width:none}
.flowtext ul,.flowtext ol{line-height:1.7;margin:0 0 .8em;padding-left:1.4em;display:grid;gap:.2em}
.flowtext h3{margin:.9em 0 .4em}
.flowtext .tbl{margin:.4em 0 1em}
.flowtext img{max-height:52vh;width:auto;border-radius:8px;border:1px solid var(--line);margin:.4em 0}
.flowtext code{font-family:var(--f-num);font-size:.9em;background:var(--grid);padding:.05em .35em;border-radius:4px}
.flowtext a{color:var(--green)}
.pdfpage{display:flex;justify-content:center}
.pdfpage img{max-height:calc(100vh - 290px);min-height:240px;width:auto;max-width:100%;object-fit:contain;border:1px solid var(--line);border-radius:6px;background:#fff;box-shadow:0 8px 22px -12px rgba(0,0,0,.45)}

/* clinical report theme */
.top b{font-family:var(--f-serif);font-size:15px}
.paper,.leaf,.under{background-image:none;border-radius:3px;box-shadow:0 1px 2px rgba(16,32,48,.08),0 14px 34px -22px rgba(16,32,48,.45)}
.rings{top:0;bottom:0;left:-7px;width:9px;display:block;border-radius:3px 0 0 3px;background:linear-gradient(90deg,var(--ring-a),var(--ring-b) 60%,var(--ring-a))}
.rings i{display:none}
.app.rtl .rings{left:auto;right:-7px;border-radius:0 3px 3px 0}
.app .tab{width:40px;min-height:44px;border:1px solid var(--line);border-left:0;border-radius:0 4px 4px 0;background:var(--paper);color:var(--muted);opacity:1;font-family:var(--f-serif);font-weight:700;font-size:15px}
.app.rtl .tab{border-left:1px solid var(--line);border-right:0;border-radius:4px 0 0 4px}
.app .tab:hover{color:var(--ink)}
.app .tab[aria-current="true"]{background:var(--green);border-color:var(--green);color:var(--on-green)}
.rh{display:flex;justify-content:space-between;gap:16px;align-items:baseline;font-size:.72em;color:var(--muted);letter-spacing:.06em;border-bottom:1px solid var(--line);padding-bottom:.55em;margin-bottom:1.3em}
.rh b{color:var(--green);font-family:var(--f-serif)}
.rh span:last-child{text-align:right}
h1{font-family:var(--f-serif);font-weight:700;letter-spacing:.01em;margin:0 0 .7em}
h3{font-family:var(--f-serif)}
.kicker{color:var(--green);font-weight:700;letter-spacing:.14em;font-size:.75em}
.ubadge{background:transparent;color:var(--green);border:1.5px solid var(--green);border-radius:4px;font-family:var(--f-serif)}
.big{font-weight:600;letter-spacing:-.01em}
.num,td.n,th.n,.count{font-variant-numeric:tabular-nums}
.app .pfoot,.app.rtl .pfoot{left:clamp(28px,5vw,80px);right:clamp(28px,5vw,80px);display:flex;justify-content:space-between;gap:16px;border-top:1px solid var(--line);padding-top:.5em;font-size:11.5px;letter-spacing:.04em}
th{border-bottom:1.5px solid var(--ink);color:var(--ink);font-weight:700}
.chip{border-radius:4px}
details.acc,.card,.toclist button{border-radius:6px}

/* ===== metal 3D theme: brushed-aluminium binder, chrome spine with screws, anodised tabs, gunmetal controls ===== */
:root{--m-hi:#f8fafc;--m-1:#dde2e7;--m-2:#b9c0c8;--m-3:#8d959e;--m-lo:#5b636c;--m-ink:#1d2731;--m-sub:#4b5661;

  --anod-hi:#4cc9cb;--anod-1:#1b9599;--anod-2:#0c5f62;--steel-text:#9fb0bf;
  --desk-bg:radial-gradient(ellipse at 50% 25%,#20272e 0%,#0e1215 70%,#07090b 100%)}}
:root[data-theme="dark"]{--m-hi:#a3adb7;--m-1:#66707a;--m-2:#4a525a;--m-3:#353b42;--m-lo:#1f2328;--m-ink:#eef3f7;--m-sub:#c3ccd4;
  --anod-hi:#4cc9cb;--anod-1:#1b9599;--anod-2:#0c5f62;--steel-text:#9fb0bf;
  --desk-bg:radial-gradient(ellipse at 50% 25%,#20272e 0%,#0e1215 70%,#07090b 100%)}
body{background:var(--desk);background-image:var(--desk-bg);background-attachment:fixed}

/* header plate */
.top{background:var(--brush),linear-gradient(180deg,var(--m-hi),var(--m-1) 55%,var(--m-2));color:var(--m-sub);

<script>
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* ---------- engine ---------- */
const $=id=>document.getElementById(id);
const CN=["","一","二","三","四","五","六","七","八","九","十","十一","十二","十三","十四","十五","十六","十七","十八","十九","二十"];
const cn=n=>CN[n]||String(n);
const PAL=["var(--green)","var(--inv)","var(--insitu)","var(--c5)","var(--c3)","var(--c4)"];
const ucol=u=>u?PAL[(u-1)%PAL.length]:"var(--c6)";
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}};
const IDB={db:null,
  open(){if(this.db)return Promise.resolve(this.db);return new Promise((res,rej)=>{const r=indexedDB.open("idea-book",1);r.onupgradeneeded=()=>r.result.createObjectStore("books");r.onsuccess=()=>res(this.db=r.result);r.onerror=()=>rej(r.error)})},
  async put(k,v){const db=await this.open();return new Promise((res,rej)=>{const tx=db.transaction("books","readwrite");tx.objectStore("books").put(v,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})},
  async del(k){const db=await this.open();return new Promise((res,rej)=>{const tx=db.transaction("books","readwrite");tx.objectStore("books").delete(k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})},
  async get(k){const db=await this.open();return new Promise((res,rej)=>{const r=db.transaction("books").objectStore("books").get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}};
const EMPTY={id:"empty",title:"報告電子書",sub:"尚未上傳檔案",foot:"上傳檔案後，內容會顯示在這裡",units:[null],pages:[{u:0,title:"開始",note:[],after:"empty",html:`<div class="cover empty">
  <div class="kicker">報告電子書</div>
  <h1>上傳檔案，開始製作報告</h1>
  <p class="sub">目前沒有任何資料。選擇一份 PDF 或 Word，系統會依標題自動切成單元，做成可以右翻的報告電子書。</p>
  <div class="erow"><button class="tbtn primary big-btn" type="button" id="emptyUp">選擇檔案</button><span class="hint">也可以直接把檔案拖進這個畫面</span></div>
  <ol class="steps"><li><b>上傳</b>PDF、Word（.docx）、Markdown、純文字或圖片</li><li><b>自動分單元</b>大標題變成單元標籤，小標題變成一頁</li><li><b>確認後報告</b>在「目錄」調整分段，再按「報告模式」投影</li></ol>
  <div id="resume" class="resume" hidden></div>
</div>`}]};
let BOOK=EMPTY,UPLOADED=null,cur=0,busy=false,dir=LS.get("bcbook-dir")==="ltr"?"ltr":"rtl";

/* unit badge follows the document's own numbering: 前言 → 序, "一 用數字看成果" → 一 */
function unitC(units,i){const n=(units[i].name||"").trim();if(/^(前言|序言?|引言)/.test(n))return"序";
  const m=n.match(/^第?([一二三四五六七八九十]{1,3})(?:[、．.\s章篇]|單元)/);if(m)return m[1];
  let k=0;for(let j=1;j<=i;j++)if(!/^(前言|序言?|引言)/.test((units[j].name||"").trim()))k++;return cn(k)}
function relabel(B){if(B&&B.units)B.units.forEach((u,i)=>{if(u)u.c=unitC(B.units,i)})}
function unitLabel(u){return u.c==="序"?"前言":`第${u.c}單元`}
function pageRange(B,k){let a=-1,b=-1;B.pages.forEach((p,i)=>{if(p.u===k){if(a<0)a=i;b=i}});if(a<0)return"";return a===b?`第 ${a+1} 頁`:`第 ${a+1}–${b+1} 頁`}
function tocAfter(){const el=document.getElementById("homeToc");if(!el)return;
  el.innerHTML=BOOK.units.slice(1).map((u,i)=>`<button type="button" data-u="${i+1}"><span class="ubadge">${u.c}</span><span class="nm">${esc(u.name)}</span><span class="d">${pageRange(BOOK,i+1)}</span></button>`).join("");
  el.querySelectorAll("button").forEach(b=>b.onclick=()=>go(BOOK.pages.findIndex(p=>p.u==b.dataset.u)))}
function emptyAfter(){$("emptyUp").onclick=()=>openUp();const r=$("resume");if(!r)return;r.hidden=!UPLOADED;
  if(UPLOADED){r.innerHTML=`<span>這個瀏覽器還保留上次轉換的「${esc(UPLOADED.title)}」</span><button class="tbtn" type="button" id="resumeGo">繼續使用</button><button class="tbtn" type="button" id="resumeDel">刪除</button>`;
    $("resumeGo").onclick=()=>{BOOK=UPLOADED;mount();paint()};$("resumeDel").onclick=async()=>{await clearAll();toast("已刪除保留的資料")}}}
function runAfter(p){if(p.after==="empty")emptyAfter();else if(p.after==="toc")tocAfter();else if(typeof p.after==="function")p.after()}

function mount(){
  const B=BOOK;if(B!==EMPTY)relabel(B);$("bookTitle").textContent=B.title;$("bookSub").textContent=B.sub||"";
  $("tabs").innerHTML=`<button class="tab home" type="button" data-u="0" title="封面與目錄">目</button>`+B.units.slice(1).map((u,i)=>`<button class="tab" type="button" data-u="${i+1}" title="${unitLabel(u)}　${esc(u.name)}（${pageRange(B,i+1)}）">${u.c}</button>`).join("");
  $("tabs").querySelectorAll(".tab").forEach(b=>b.onclick=()=>{if(b.dataset.u==="0"){const t=B.pages.findIndex(p=>p.after==="toc");go(t<0?0:t)}else go(B.pages.findIndex(p=>p.u==b.dataset.u))});
  requestAnimationFrame(fitTabs);
  $("dots").innerHTML=B.pages.map((p,i)=>`<button class="dot" type="button" style="background:${ucol(p.u)}" aria-label="第 ${i+1} 頁 ${esc(p.title)}" data-i="${i}"></button>`).join("");
  $("dots").querySelectorAll(".dot").forEach(d=>d.onclick=()=>go(+d.dataset.i));
  $("tocList").innerHTML=B.pages.map((p,i)=>`<li><button type="button" data-i="${i}"><span class="pn">${i+1}</span>${p.u?`<span class="ubadge">${B.units[p.u].c}</span>`:""}${esc(p.title)}</button></li>`).join("");
  $("tocList").querySelectorAll("button").forEach(b=>b.onclick=()=>{$("toc").hidden=true;go(+b.dataset.i)});
  $("btnEdit").hidden=B===EMPTY;$("btnPpt").hidden=B===EMPTY;
  const sb=$("btnSample");
  sb.hidden=B===EMPTY;sb.textContent="清除資料";sb.dataset.arm="";
  const s=parseInt(LS.get("bcbook-page-"+B.id),10);cur=s>=0&&s<B.pages.length?s:0;
}
function pageHTML(i){const p=BOOK.pages[i],u=BOOK.units[p.u],n=BOOK.pages.length;
  const head=u?`<div class="rh"><span><b>${unitLabel(u)}</b>　${esc(u.name)}</span><span>${esc(BOOK.title)}</span></div><h1>${esc(p.title)}</h1>`:"";
  const foot=BOOK.foot||(BOOK.src?`資料來源：${BOOK.src}`:BOOK.title);
  const cls=/class="pdfpage fill"/.test(p.html)?" pdfmode":/class="flowtext"/.test(p.html)?" fit":"";
  return `<div class="pg${cls}">${head}${p.html}</div><div class="pfoot"><span>${esc(foot)}</span><span class="num">${i+1} / ${n}</span></div>`}
function noteKey(){return `bcbook-note-${BOOK.id}-${cur}`}
function paint(){
  const B=BOOK,p=B.pages[cur];
  $("paper").innerHTML=pageHTML(cur);$("paper").scrollTop=0;runAfter(p);fitTitle();fitText();fitTitle();placeInk();inkHint();
  $("count").textContent=`${cur+1} / ${B.pages.length}`;
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-current",+t.dataset.u===p.u));
  document.querySelectorAll(".dot").forEach((d,i)=>d.setAttribute("aria-current",i===cur));
  document.querySelectorAll("#tocList button").forEach((b,i)=>b.setAttribute("aria-current",i===cur));
  if(B===EMPTY){$("note").innerHTML=`<div class="h">講師筆記</div><p style="margin:0">上傳檔案後，每一頁都可以加上講師筆記。</p>`;updBtns();return}
  const k=noteKey();let lines=p.note||[];const saved=LS.get(k);if(saved!=null){try{lines=JSON.parse(saved)}catch(e){}}
  $("note").innerHTML=`<div class="h">講師筆記　${cur+1} / ${B.pages.length}<span>點文字可直接修改</span></div><ul id="noteUl" contenteditable="true" spellcheck="false" aria-label="講師筆記">${lines.map(l=>`<li>${esc(l)}</li>`).join("")}</ul>`;
  $("noteUl").addEventListener("blur",e=>{const v=e.target.innerText.split("\n").map(s=>s.trim()).filter(Boolean);LS.set(k,JSON.stringify(v))});
  updBtns();LS.set("bcbook-page-"+B.id,cur);
}
/* grow the font until the text fills the page */
function fitText(){const paper=$("paper"),pg=paper.querySelector(".pg.fit");if(!pg)return;
  const h1=pg.querySelector("h1"),cap=h1?parseFloat(h1.style.fontSize||getComputedStyle(h1).fontSize)*.78:64;let lo=11,hi=Math.max(12,Math.min(64,paper.clientHeight/10,cap));const fits=()=>{if(paper.scrollHeight>paper.clientHeight+.5)return false;const f=paper.querySelector(".pfoot"),c=pg.lastElementChild;return!f||!c||f.getBoundingClientRect().top-c.getBoundingClientRect().bottom>=4};pg.style.fontSize=lo+"px";if(!fits())return;
  for(let k=0;k<9;k++){const m=(lo+hi)/2;pg.style.fontSize=m+"px";if(fits())lo=m;else hi=m}
  pg.style.fontSize=lo.toFixed(1)+"px";
  const imgs=pg.querySelectorAll("img");imgs.forEach(im=>{if(!im.complete)im.addEventListener("load",()=>fitText(),{once:true})})}
/* keep every big title on one line: shrink it until it fits the width */
function fitTitle(){const pa=$("paper");pa.querySelectorAll(".pg h1").forEach(h=>{const fit=h.closest(".pg.fit");if(!fit||!h.dataset.fs){h.style.fontSize=fit?Math.min(56,Math.max(24,pa.clientHeight/9)).toFixed(1)+"px":""}
  let fs=parseFloat(fit&&h.dataset.fs?h.dataset.fs:getComputedStyle(h).fontSize);h.style.fontSize=fs+"px";
  for(let k=0;k<40&&h.scrollWidth>h.clientWidth+1&&fs>14;k++){fs*=.95;h.style.fontSize=fs.toFixed(1)+"px"}if(fit)h.dataset.fs=fs})}
/* every unit tab must stay visible: shrink tabs and their numerals to fit the sidebar height */
function fitTabs(){const t=$("tabs"),bs=t.querySelectorAll(".tab"),n=bs.length;if(!n)return;
  if(getComputedStyle(t).flexDirection==="row"){t.style.removeProperty("--tab-h");t.style.removeProperty("--tab-fs");return}
  const cs=getComputedStyle(t),avail=t.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom),gap=n>14?3:6;
  const h=Math.max(16,Math.min(46,(avail-gap*(n-1))/n));t.style.setProperty("--tab-gap",gap+"px");t.style.setProperty("--tab-h",h+"px");
  t.style.setProperty("--tab-fs",Math.max(10,Math.min(17,h*.42))+"px")}
if(document.fonts){document.fonts.ready.then(()=>{fitText();fitTitle()});document.fonts.addEventListener&&document.fonts.addEventListener("loadingdone",()=>{fitText();fitTitle()})}
let rsz;addEventListener("resize",()=>{clearTimeout(rsz);rsz=setTimeout(()=>{$("paper").querySelectorAll("h1[data-fs]").forEach(h=>delete h.dataset.fs);fitTabs();fitText();fitTitle();placeInk()},150)});
function updBtns(){const first=cur===0,last=cur===BOOK.pages.length-1;$("btnL").disabled=dir==="rtl"?last:first;$("btnR").disabled=dir==="rtl"?first:last}
function layer(cls,html,st){const d=document.createElement("div");d.className=cls;d.setAttribute("aria-hidden","true");
  d.innerHTML=st?`<div style="transform:translateY(${-st}px)">${html}</div>`:html;d.querySelectorAll("[id]").forEach(e=>e.removeAttribute("id"));return d}
function go(i){
  if(busy||i<0||i>=BOOK.pages.length||i===cur)return;
  const paper=$("paper"),sheet=$("sheet"),reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduce||!paper.animate){cur=i;paint();return}
  const fwd=i>cur,oldH=paper.innerHTML,st=paper.scrollTop;cur=i;paint();const newH=paper.innerHTML;
  const spineR=dir==="rtl";
  const ang=(spineR?1:-1)*96;
  const leaf=layer("leaf",fwd?oldH:newH,fwd?st:0);leaf.style.transformOrigin=spineR?"right center":"left center";
  const shade=document.createElement("div");shade.className="shade "+(spineR?"r":"l");leaf.appendChild(shade);
  let under=null;if(!fwd){under=layer("under",oldH,st);sheet.appendChild(under)}
  sheet.appendChild(leaf);busy=true;
  const opt={duration:640,easing:"cubic-bezier(.45,.05,.3,1)",fill:"forwards"};
  const a=leaf.animate(fwd?[{transform:"rotateY(0deg)"},{transform:`rotateY(${ang}deg)`}]:[{transform:`rotateY(${ang}deg)`},{transform:"rotateY(0deg)"}],opt);
  shade.animate(fwd?[{opacity:0},{opacity:.55}]:[{opacity:.55},{opacity:0}],opt);
  const done=()=>{if(!busy)return;leaf.remove();under&&under.remove();busy=false};
  a.onfinish=done;setTimeout(done,1000);
}
const next=()=>go(cur+1),prev=()=>go(cur-1);
function setDir(d){dir=d;$("app").classList.toggle("rtl",d==="rtl");
  $("dirR").setAttribute("aria-pressed",d==="rtl");$("dirL").setAttribute("aria-pressed",d!=="rtl");
  $("btnL").setAttribute("aria-label",d==="rtl"?"下一頁":"上一頁");$("btnR").setAttribute("aria-label",d==="rtl"?"上一頁":"下一頁");
  LS.set("bcbook-dir",d);updBtns()}

$("rings").innerHTML="<i></i>".repeat(10);
$("paper").addEventListener("click",e=>{if(tool.on)return;const im=e.target.closest(".pdfpage img");if(im){im.parentElement.classList.toggle("zoom");placeInk()}});
$("btnL").onclick=()=>dir==="rtl"?next():prev();
$("btnR").onclick=()=>dir==="rtl"?prev():next();
$("dirR").onclick=()=>setDir("rtl");$("dirL").onclick=()=>setDir("ltr");
$("btnNote").onclick=()=>{const n=$("note");n.hidden=!n.hidden;$("btnNote").setAttribute("aria-pressed",!n.hidden)};
$("btnToc").onclick=()=>{$("toc").hidden=false;showEdit(false)};
function showEdit(on){$("editBox").hidden=!on;$("tocList").hidden=on;$("btnEdit").hidden=on||BOOK===EMPTY;if(!on)return;
  const B=BOOK;let prevU=-1;
  $("editRows").innerHTML=B.pages.map((p,i)=>{if(i<2)return"";const st=p.u!==prevU;prevU=p.u;const first=i===2;
    return `<div class="er${st?" start":""}" data-i="${i}"><label><input type="checkbox" id="es${i}" ${st?"checked":""} ${first?"disabled":""}>新單元</label><input type="text" id="et${i}" value="${esc(p.title)}" aria-label="第 ${i+1} 頁標題"><input class="un" type="text" id="eu${i}" value="${esc(B.units[p.u]?B.units[p.u].name:p.title)}" placeholder="單元名稱" aria-label="單元名稱" ${st?"":"hidden"}></div>`}).join("");
  $("editRows").querySelectorAll("input[type=checkbox]").forEach(c=>c.onchange=()=>{const r=c.closest(".er"),i=r.dataset.i;r.classList.toggle("start",c.checked);$("eu"+i).hidden=!c.checked;if(c.checked&&!$("eu"+i).value)$("eu"+i).value=$("et"+i).value})}
$("btnEdit").onclick=()=>showEdit(true);
$("editCancel").onclick=()=>showEdit(false);
$("editSave").onclick=async()=>{const B=BOOK,units=[null];let u=0;
  B.pages.forEach((p,i)=>{if(i<2)return;const t=$("et"+i).value.trim()||p.title;p.title=t;
    if(i===2||$("es"+i).checked){units.push({c:cn(units.length),name:$("eu"+i).value.trim()||t});u=units.length-1}p.u=u});
  B.units=units;B.sub=`${units.length-1} 個單元 · ${B.pages.length} 頁`;if(B.src)B.pages[0].html=coverHTML(B.title,units.length-1,B.pages.length-2,B.src);
  const c=cur;mount();cur=c;paint();showEdit(false);$("toc").hidden=true;toast(`已更新為 ${units.length-1} 個單元`);try{await IDB.put("current",B)}catch(e){}};
$("toc").onclick=e=>{if(e.target.id==="toc")$("toc").hidden=true};
function setPresent(on){$("app").classList.toggle("present",on);$("btnFs").setAttribute("aria-pressed",on);

  for(const n of names){let x=await zip.file(n).async("string");
    x=x.replace(/<a:ea typeface="Times New Roman"/g,`<a:ea typeface="${KAI}"`).replace(/(<a:(?:major|minor)Font>[\s\S]*?)<a:ea typeface=""/g,`$1<a:ea typeface="${KAI}"`);zip.file(n,x)}
  return zip.generateAsync({type:"blob",mimeType:"application/vnd.openxmlformats-officedocument.presentationml.presentation"})}
let exporting=false;
$("btnPpt").onclick=async()=>{if(exporting||BOOK===EMPTY)return;exporting=true;const b=$("btnPpt");b.disabled=true;
  try{const blob=await buildPptx();const dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null;
    const name=(BOOK.title||"報告").replace(/[\\/:*?"<>|]/g,"_")+".pptx";
    if(!dl){const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);toast(`已匯出「${name}」`);return}
    await dl.save({filename:name,data:blob});toast(`已匯出「${name}」，共 ${BOOK.pages.length} 張投影片`)}
  catch(e){const c=e&&e.code;toast(c==="declined"?"已取消下載":c==="rate_limited"?"下載視窗已開啟，請先完成或關閉它":c==="too_large"?"檔案太大，無法匯出":(e&&e.message)||"匯出失敗，請再試一次");console.error(e)}
  finally{exporting=false;b.disabled=false}};
setDir(dir);mount();paint();
(async()=>{try{const b=await IDB.get("current");if(b&&b.pages&&b.pages.length&&BOOK===EMPTY){UPLOADED=b;emptyAfter()}}catch(e){}})();
